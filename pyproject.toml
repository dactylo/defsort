# ==========================================================
# Build System
# ==========================================================
[build-system]
build-backend = "hatchling.build"
requires = [ "editables~=0.3", "hatch-fancy-pypi-readme>=25.1", "hatchling>=1.27" ]

# ==========================================================
# Project Metadata
# ==========================================================
[project]
name = "defsort"
version = "0.2.0"
description = "Sort Python definitions by dependency or alphabetically"
keywords = [ "ast", "definitions", "dependency", "formatter", "sort" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dynamic = [ "entry-points", "readme" ]
urls.Documentation = "https://github.com/dactylo/defsort/tree/main/docs"
urls.Homepage = "https://github.com/dactylo/defsort"
urls.Issues = "https://github.com/dactylo/defsort/issues"
urls.Repository = "https://github.com/dactylo/defsort"
scripts.defsort = "defsort._main:main"

[dependency-groups]
dev = [
  "mdformat",
  "mdformat-config",
  "mdformat-frontmatter",
  "mdformat-gfm",
  "mdformat-pyproject",
  "mdformat-ruff",
  "mdformat-shfmt",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "vulture",
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-xdist>=3.2",
]
ci-build = [
  "cython>=3",
  "setuptools>=84",
]

[tool.hatch]
metadata.hooks.custom.path = "_build.py"
build.targets.wheel.include = [ "/plugins/*/_defsort/", "/src/defsort/" ]
build.targets.sdist.include = [ "/README.md", "/_build.py", "/plugins", "/src" ]
build.targets.wheel.sources = [ "src" ]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [ { path = "README.md" } ]

# Keep checkout links relative; package links target this release.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]\n]*\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://raw.githubusercontent.com/dactylo/defsort/v$HFPR_VERSION/\2\3'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)(\[[^\]\n]+\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://github.com/dactylo/defsort/blob/v$HFPR_VERSION/\2\3'

[tool.uv]
# CI supplies the native Taplo CLI; its Python package lacks Linux/Windows ARM wheels.
exclude-dependencies = [
  { package = { name = "mdformat-config", version = "0.2.1" }, dependencies = [ "taplo" ] },
]

# ==========================================================
# Ruff Configuration
# ==========================================================
[tool.ruff]
target-version = "py313"
line-length = 99
namespace-packages = [ "plugins" ]
include = [
  "_build.py",
  "conftest.py",
  "plugins/**/*.{py,pyi,ipynb}",
  "pyproject.toml",
  "src/**/*.{py,pyi,ipynb}",
  "tests/**/*.{py,pyi,ipynb}",
]
format.quote-style = "single"
format.exclude = [ "*.md" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Conflicts with the Ruff formatter
  "CPY001", # Copyright notices are not required
  "EM101",  # Exception must not use string literal
  "EM102",  # Exception must not use f-string literal
  "FBT001", # Boolean positional arg in function definition
  "Q000",   # Conflicts with the Ruff formatter
  "Q003",   # Conflicts with the Ruff formatter
  "T201",   # print() found
  "TRY003", # Avoid specifying long messages outside exception class
]
lint.per-file-ignores."plugins/*/tests/**/*.py" = [
  "D",    # No docstrings required in tests
  "S101", # Allow asserts in tests
]
# Same-file private-member collaboration follows the module privacy boundary.
lint.per-file-ignores."src/defsort/_core/_ordering.py" = [ "SLF001" ]
lint.per-file-ignores."src/defsort/_vendor/hookshell/_grammar.py" = [ "SLF001" ]
lint.per-file-ignores."src/defsort/_vendor/hookshell/_shellparse.py" = [ "SLF001" ]
lint.per-file-ignores."tests/**/*.py" = [
  "D",       # No docstrings required in tests
  "PLR2004", # Allow magic values in tests
  "S101",    # Allow asserts in tests
  "S603",    # Allow subprocess calls in tests
  "S607",    # Allow partial executable paths in tests
  "SLF001",  # Tests intentionally inspect and patch private state
]
lint.external = [ "V" ]
lint.pydocstyle.convention = "google"

# ==========================================================
# Vulture Configuration
# ==========================================================
[tool.vulture]
ignore_names = [
  "pytestmark", # Read dynamically by pytest.
]

[tool.pyproject-fmt]
max_supported_python = "3.15"

# ==========================================================
# Pyright Configuration
# ==========================================================
[tool.pyright]
pythonVersion = "3.13"  # Keep in sync with tool.ruff.target-version
typeCheckingMode = "strict"
include = [ "_build.py", "conftest.py", "plugins", "src", "tests" ]
extraPaths = [ ".", "src" ]
executionEnvironments = [
  { root = "tests", reportPrivateUsage = "none" },
  { root = "." },
]

# ==========================================================
# Pytest Configuration
# ==========================================================
[tool.pytest]
ini_options.testpaths = [ "plugins", "tests" ]
ini_options.pythonpath = [ ".", "src" ]
ini_options.addopts = [ "-q", "--strict-markers", "--tb=short" ]
ini_options.markers = [ "slow: marks tests as slow (deselect with '-m \"not slow\"')" ]
ini_options.faulthandler_timeout = 300

# ==========================================================
# Mdformat Configuration (Requires mdformat-pyproject)
# ==========================================================
[tool.mdformat]
wrap = 99  # Keep in sync with tool.ruff.line-length
number = true
